<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Park Hub</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { 
            background-color: #0f0f0f; 
            color: #fff; 
            padding: 16px; 
            overflow-x: hidden;
        }

        header { 
            text-align: center; 
            margin-bottom: 24px; 
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        header h1 { color: #ffcc00; font-size: 26px; font-weight: 700; margin-bottom: 4px; }
        header p { color: #888; font-size: 13px; }
        
        .seasons-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }

        .season-card {
            background: #1a1a1a;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            border: 1px solid #262626;
            cursor: pointer;
            will-change: transform;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, border-color 0.2s ease;
        }

        .season-card:active { 
            transform: scale(0.94); 
            background: #252525;
            border-color: #ffcc00;
        }

        .season-card h3 { font-size: 18px; color: #fff; margin-bottom: 4px; }
        .season-card span { font-size: 11px; color: #ff5722; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .season-card.hit {
            border-color: rgba(255, 204, 0, 0.3);
            background: linear-gradient(135deg, #1a1a1a 0%, #262200 100%);
        }
        .season-card.hit span { color: #ffcc00; }

        .screen {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s;
            will-change: opacity, transform;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            position: relative;
        }

        .back-btn {
            background: #222; color: #fff; border: 1px solid #333; padding: 10px 18px;
            border-radius: 10px; margin-bottom: 20px; cursor: pointer; font-size: 14px; font-weight: 500;
            display: inline-flex; align-items: center; gap: 6px;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .back-btn:active { transform: scale(0.96); background: #333; }

        .episode-item {
            background: #1a1a1a; padding: 14px 16px; border-radius: 12px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #262626;
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
            transition: background 0.2s ease;
        }
        .episode-item:active { background: #222; }
        .episode-item span { font-size: 15px; color: #e0e0e0; }
        .episode-item .play-icon { color: #ffcc00; font-size: 14px; }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="main-screen" class="screen active">
        <header>
            <h1>South Park</h1>
            <p>Усі сезони • Paramount Comedy</p>
        </header>
        
        <div class="seasons-grid" id="seasonsList"></div>
    </div>

    <div id="episodes-screen" class="screen">
        <button class="back-btn" onclick="goBack()">← Назад до сезонів</button>
        <h2 id="seasonTitle" style="margin-bottom: 16px; color: #ffcc00; font-size: 22px;"></h2>
        <div id="episodesList"></div>
    </div>

    <script>
        const seasonsData = {
            6: [
                "Серія 1: Оберт уродів", 
                "Серія 2: Без тупих мізків", 
                "Серія 3: Професійні ковбої",
                "Серія 4: Сонце, моє сонце",
                "Серія 5: Великаста історія"
            ],
            7: [
                "Серія 1: Кончина Ісуса", 
                "Серія 2: Застосування калу", 
                "Серія 3: Власні труси",
                "Серія 4: Концерт у місті"
            ],
        };

        function renderSeasons() {
            const grid = document.getElementById('seasonsList');
            let html = '';
            for (let i = 1; i <= 26; i++) {
                let isHit = (i === 6 || i === 7);
                let badge = isHit ? "🔥 Улюблений сезон" : "Сезон";
                let cardClass = isHit ? "season-card hit" : "season-card";
                
                html += `
                    <div class="${cardClass}" onclick="openSeason(${i})">
                        <h3>Сезон ${i}</h3>
                        <span>${badge}</span>
                    </div>
                `;
            }
            grid.innerHTML = html;
        }

        function openSeason(num) {
            document.getElementById('seasonTitle').innerText = `Сезон ${num}`;
            const epList = document.getElementById('episodesList');
            epList.innerHTML = '';
            
            let eps = seasonsData[num] || [
                "Серія 1 (Paramount Comedy)", 
                "Серія 2 (Paramount Comedy)", 
                "Серія 3 (Paramount Comedy)"
            ];
            
            eps.forEach((ep, index) => {
                epList.innerHTML += `
                    <div class="episode-item" style="animation-delay: ${index * 0.05}s">
                        <span>${ep}</span> 
                        <span class="play-icon">▶</span>
                    </div>
                `;
            });

            document.getElementById('main-screen').classList.remove('active');
            document.getElementById('episodes-screen').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            document.getElementById('episodes-screen').classList.remove('active');
            document.getElementById('main-screen').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderSeasons();
    </script>
</body>
</html>
