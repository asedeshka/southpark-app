name: Build Web App APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Отримання коду
      uses: actions/checkout@v4

    - name: 📦 Збереження веб-файлів як артефакту
      uses: actions/upload-artifact@v4
      with:
        name: southpark-app-web
        path: index.html

